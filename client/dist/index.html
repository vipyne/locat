<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>lofi</title>
    <script type="module" crossorigin src="./assets/index-B3xkCjXp.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-AuRXsCA1.css">
  </head>
  <body>
    <header>
      <h1>lofi</h1>
      <div id="controls">
        <select id="mode-select" title="session mode">
          <option value="offline">&#x1F50C; offline</option>
          <option value="online">&#x2601;&#xFE0F; online</option>
        </select>
        <button id="connect">Connect</button>
        <button id="mute" disabled>Mute</button>
        <button id="mode-toggle" hidden title="analyst mode">&#x1F9E0; accurate</button>
        <span id="connection-state">disconnected</span>
        <span id="transport-name" title="transport"></span>
      </div>
    </header>
    <div id="online-banner" hidden></div>
    <main id="app">
      <section id="transcript" aria-label="conversation transcript"></section>
      <form id="composer">
        <input
          id="text-input"
          type="text"
          placeholder="Type a message"
          autocomplete="off"
          disabled
        />
        <button id="send" type="submit" disabled>Send</button>
      </form>
      <aside id="panels">
        <section id="config-panel" aria-label="what's running">
          <h2>what's running</h2>
          <pre id="config-lines">connect to see the running config</pre>
        </section>
        <section id="rag-panel" aria-label="retrieved context">
          <h2>retrieved context <span id="rag-stopwatch"></span></h2>
          <div id="rag-turns">ask about your records — retrieved context shows up here</div>
        </section>
      </aside>
    </main>
  </body>
</html>
