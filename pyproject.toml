[project]
name = "locat"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "loguru>=0.7.3",
    "moq-rs>=0.3.2,<0.4.0",
    "num2words>=0.5.14",
    "pipecat-ai-prebuilt>=1.0.5",
    "pipecat-ai[kokoro,mlx-whisper,moq,silero,webrtc,whisper]>=1.7.0",
    "pyaudio>=0.2.14",
    "python-dotenv>=1.2.2",
    "textual>=8.2.8",
]

# Optional STT/TTS engines (see services.py; pick via ./doctor.sh -i):
#   uv sync --extra moonshine --extra piper
# NOTE: piper-tts is GPL-3.0 — fine for running this repo, but relevant if you
# distribute a closed-source app built on it.
[project.optional-dependencies]
moonshine = ["pipecat-ai[moonshine]"]
piper = ["pipecat-ai[piper]"]
