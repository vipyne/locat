# Pipecat Cloud deployment config for the `locat` cloud bot.
#
# Run `pipecat cloud deploy` from the REPO ROOT with this file (copy it to the root, or
# see deploy/README.md for the exact invocation). Fields you MUST edit are marked TODO.

agent_name = "locat"

# TODO: your image ref. Either push to a registry and set this, OR rely on cloud build
# (the [build] block below) and Pipecat builds + hosts it for you.
image = "YOUR_DOCKER_USER/locat:0.1"

# The secret set holding OLLAMA_BASE_URL / OLLAMA_API_KEY / DAILY_API_KEY (see README).
secret_set = "locat-secrets"

agent_profile = "agent-1x"        # CPU profile (no GPU) — that's why the LLM is remote
region = "us-west"
max_session_duration = 1800       # seconds; sessions force-close at this limit

[scaling]
min_agents = 0                    # scale to zero when idle (cheaper; adds cold-start)
max_agents = 2

# Cloud build: point at the repo-root context + the deploy Dockerfile, so `pipecat cloud
# deploy` builds and pushes the image for you (no manual docker build/push needed).
[build]
context_dir = "."
dockerfile = "deploy/Dockerfile"

# Keep the build context small — don't ship model weights, venvs, or local-only stuff.
[build.exclude]
patterns = ["models/", ".venv/", "spike-vpio/", "ralph/logs/", "*.log", "__pycache__/"]
